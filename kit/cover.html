<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa do story espaço em disco</title>
<style>
/* Capa de story 1080x1920: gancho em 2 linhas, janela de Armazenamento borrada com uma linha em foco, chamada para o próximo story.
   Todo texto fica entre y=250 e y=1670 (zonas livres do Instagram). */
@font-face { font-family: 'Inter'; font-weight: 400; src: url(fonts/Inter-Regular.otf); }
@font-face { font-family: 'Montserrat'; font-weight: 600; src: url(fonts/montserrat-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: 'Montserrat'; font-weight: 700; src: url(fonts/montserrat-latin-700-normal.woff2) format('woff2'); }
:root { --display: 'Montserrat', 'Segoe UI', sans-serif; --body: 'Inter', 'Segoe UI', sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #fff; }
#art { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #fff; color: #25211E; font-family: var(--body); }
.stripe { position: absolute; left: 0; top: 0; width: 24px; height: 1600px; background: #005A8C; }

.eyebrow { position: absolute; left: 80px; top: 330px; margin: 0; font-family: var(--display); font-weight: 700; font-size: 28px; letter-spacing: .26em; color: #005A8C; }
h1 { position: absolute; left: 80px; top: 390px; width: 960px; margin: 0; font-family: var(--display); font-weight: 700; font-size: 86px; line-height: 1.12; color: #25211E; white-space: nowrap; }
h1 em { font-style: normal; color: #005A8C; }
.sub { position: absolute; left: 80px; top: 640px; width: 940px; margin: 0; font-size: 42px; line-height: 1.3; color: #595959; white-space: nowrap; }

.tz { position: absolute; left: 80px; top: 760px; width: 952px; height: 710px; border-radius: 28px; overflow: hidden; background: linear-gradient(135deg, #DCEBF7 0%, #A9CBE9 55%, #7FA9D1 100%); box-shadow: 0 24px 60px rgba(37,33,30,.2); }
.tz .blob1 { position: absolute; width: 560px; height: 560px; border-radius: 50%; background: rgba(255,255,255,.35); left: -150px; top: -240px; }
.tz .blob2 { position: absolute; width: 620px; height: 620px; border-radius: 50%; background: rgba(0,90,140,.16); right: -200px; bottom: -330px; }
.blur { position: absolute; left: 0; top: 0; width: 952px; height: 710px; filter: blur(7px); }
.panel { position: absolute; left: 60px; top: 40px; width: 832px; height: 700px; background: #F7F8F9; border-radius: 22px; box-shadow: 0 12px 40px rgba(0,0,0,.18); }
.h { position: absolute; left: 40px; top: 36px; width: 380px; height: 34px; border-radius: 8px; background: #25211E; opacity: .85; }
.card { position: absolute; left: 40px; top: 108px; width: 752px; height: 190px; background: #fff; border: 2px solid #E3E5E7; border-radius: 16px; }
.card .t { position: absolute; left: 24px; top: 22px; width: 210px; height: 22px; border-radius: 6px; background: #25211E; opacity: .8; }
.card .tag { position: absolute; right: 24px; top: 20px; width: 130px; height: 28px; border-radius: 6px; background: #FBEBD2; }
.card .bar { position: absolute; left: 24px; top: 92px; width: 704px; height: 22px; border-radius: 11px; background: #E3E5E7; overflow: hidden; }
.card .bar div { width: 90%; height: 100%; background: #B26A00; border-radius: 11px; }
.card .s { position: absolute; left: 24px; top: 138px; width: 260px; height: 16px; border-radius: 6px; background: #A8B0B7; }
.row { position: absolute; left: 40px; width: 752px; height: 92px; background: #fff; border: 2px solid #E3E5E7; border-radius: 14px; }
.row .i { position: absolute; left: 24px; top: 22px; width: 44px; height: 44px; border-radius: 10px; }
.row .a { position: absolute; left: 88px; top: 26px; width: 240px; height: 20px; border-radius: 6px; background: #25211E; opacity: .75; }
.row .b { position: absolute; left: 88px; top: 56px; width: 160px; height: 13px; border-radius: 6px; background: #A8B0B7; }
.row .z { position: absolute; right: 24px; top: 34px; width: 90px; height: 18px; border-radius: 6px; background: #A8B0B7; }

/* foco: o anel, a interrogação e o cursor ficam nítidos sobre o fundo borrado. Linha em foco: x 100..852, y 482..574 dentro de .tz */
.ring { position: absolute; left: 88px; top: 470px; width: 776px; height: 116px; border: 6px solid #005A8C; border-radius: 24px; box-shadow: 0 0 0 10px rgba(0,90,140,.25), 0 0 0 26px rgba(0,90,140,.1); }
.q { position: absolute; left: 770px; top: 418px; width: 84px; height: 84px; border-radius: 50%; background: #005A8C; color: #fff; font-family: var(--display); font-weight: 700; font-size: 54px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,.25); }
.cur { position: absolute; left: 520px; top: 530px; width: 78px; height: 104px; filter: drop-shadow(0 6px 8px rgba(0,0,0,.4)); }

.cta { position: absolute; left: 80px; top: 1506px; width: 952px; height: 86px; border-radius: 16px; background: #005A8C; color: #fff; display: flex; align-items: center; justify-content: center; gap: 22px; font-family: var(--display); font-weight: 700; font-size: 35px; }
.cta svg { width: 44px; height: 30px; }

.foot { position: absolute; left: 0; top: 1600px; width: 1080px; height: 320px; background: #25211E; }
.foot .f1 { position: absolute; left: 48px; top: 18px; font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: .24em; color: #7CAFDD; }
.foot .f2 { position: absolute; right: 48px; top: 18px; font-size: 26px; color: #D9DBDD; }
</style>
</head>
<body>
<div id="art">
  <div class="stripe"></div>
  <p class="eyebrow" id="eyebrow"></p>
  <h1 id="h1"><span id="l1"></span><br><em id="l2"></em></h1>
  <p class="sub" id="sub"></p>

  <div class="tz">
    <div class="blob1"></div><div class="blob2"></div>
    <div class="blur">
      <div class="panel">
        <div class="h"></div>
        <div class="card"><div class="t"></div><div class="tag"></div><div class="bar"><div></div></div><div class="s"></div></div>
        <div class="row" style="top:330px"><div class="i" style="background:#7CAFDD"></div><div class="a"></div><div class="b"></div><div class="z"></div></div>
        <div class="row" style="top:442px"><div class="i" style="background:#005A8C"></div><div class="a"></div><div class="b"></div><div class="z"></div></div>
        <div class="row" style="top:554px"><div class="i" style="background:#C9CDD1"></div><div class="a"></div><div class="b"></div><div class="z"></div></div>
      </div>
    </div>
    <div class="ring"></div>
    <div class="q">?</div>
    <svg class="cur" viewBox="0 0 14 21"><path d="M0.8 0.8 L0.8 16.2 L4.6 12.8 L7.4 19.6 L9.9 18.5 L7.1 11.9 L12.4 11.9 Z" fill="#fff" stroke="#25211E" stroke-width="1.1" stroke-linejoin="round"/></svg>
  </div>

  <div class="cta" id="cta">
    <span id="ctaT"></span>
    <svg viewBox="0 0 44 30"><path d="M4 15h34M26 4l12 11-12 11" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <div class="foot"><span class="f1">R3 INFORMÁTICA</span><span class="f2">r3informatica.com.br</span></div>
</div>
<script>
var C = window.__SPEC.cover;
document.getElementById('eyebrow').textContent = C.eyebrow || 'DICA RÁPIDA DE INFORMÁTICA';
document.getElementById('l1').textContent = C.l1;
document.getElementById('l2').textContent = C.l2;
document.getElementById('sub').textContent = C.sub;
document.getElementById('ctaT').textContent = C.cta || 'Veja como no próximo story';
</script>
</body>
</html>
